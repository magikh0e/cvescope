[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cvescope"
dynamic = ["version"]
description = "Track the CVEs that hit the gear you actually run, ranked by real-world exploitation (KEV, EPSS, Metasploit, Nuclei, Exploit-DB, public PoCs)."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []
keywords = ["cve", "vulnerability", "kev", "epss", "exploit", "homelab", "vulnerability-management"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: System Administrators",
  "Intended Audience :: Information Technology",
  "Natural Language :: English",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Topic :: Security",
  "Topic :: System :: Monitoring",
  "Environment :: Console",
  "Environment :: Web Environment",
]

[project.urls]
Homepage = "https://github.com/magikh0e/cvescope"
Documentation = "https://magikh0e.pl/pubCode/cvescope.html"
Issues = "https://github.com/magikh0e/cvescope/issues"
Changelog = "https://github.com/magikh0e/cvescope/blob/main/CHANGELOG.md"
Source = "https://github.com/magikh0e/cvescope"

[project.scripts]
cvescope = "cvescope.cli:main"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]  # ruff's defaults, spelled out so a newer ruff can't change them under CI

[tool.setuptools]
packages = ["cvescope", "cvescope.sources", "cvescope.collectors"]

[tool.setuptools.dynamic]
version = {attr = "cvescope.__version__"}

[tool.setuptools.package-data]
cvescope = ["web/*", "config.example.toml"]
