<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>cvescope</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top">
  <div class="brand"><img class="mark" src="/favicon.svg" alt="" width="24" height="24"> cvescope <a class="appver" id="appVersion" target="_blank" rel="noopener noreferrer"></a></div>
  <div class="totals" id="totals"></div>
  <div class="syncbox">
    <span class="health" id="health" role="status"></span>
    <button class="syncnow" id="syncNow" type="button" hidden>sync now</button>
  </div>
  <form class="search" id="searchForm" role="search">
    <input id="q" type="search" placeholder="CVE / GHSA / PSA ID or keyword" autocomplete="off" aria-label="Search CVEs and advisories">
  </form>
</header>
<div class="syncline" id="syncLine" hidden></div>
<div class="banner" id="healthBanner" role="alert" hidden></div>

<div class="layout">
  <aside class="inv" aria-label="Inventory">
    <div class="inv-head">
      <h2>Inventory</h2>
      <button class="linkish" id="allItems" type="button">all</button>
    </div>
    <div class="inv-tools">
      <input id="invFilter" type="search" placeholder="filter: name, host, version" autocomplete="off" aria-label="Filter the inventory">
      <label>group <select id="invGroup"><option value="host">host</option><option value="source">source</option><option value="none">none</option></select></label>
      <label>sort <select id="invSort"><option value="risk">exposure</option><option value="name">name</option></select></label>
    </div>
    <ul id="items"></ul>
    <div class="feeds" id="feeds"></div>
  </aside>

  <main>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="exposure" class="on">Your exposure</button>
      <button role="tab" data-tab="changes">Changes</button>
      <button role="tab" data-tab="hot">Out in the wild</button>
      <button role="tab" data-tab="search" hidden id="searchTab">Search</button>
    </nav>

    <section id="exposure" class="pane on">
      <div class="filters narrow">
        <label>host <select id="fHost"><option value="">all hosts</option></select></label>
        <input id="fText" type="search" placeholder="filter: CVE, title, item" autocomplete="off" aria-label="Filter the matches">
        <label>sort <select id="fSort"><option value="tier">tier</option><option value="new">newest</option><option value="cvss">CVSS</option><option value="epss">EPSS</option></select></label>
        <label>fix <select id="fFix" title="Is there an update you can install?"><option value="">any</option><option value="available">available</option><option value="none">not yet</option><option value="wontfix">not planned</option><option value="unknown">not known</option></select></label>
        <label>group <select id="fGroup"><option value="">none</option><option value="host">host</option><option value="item">item</option><option value="fix">fix</option></select></label>
        <span class="reportlinks" title="A report for what's shown: the host you picked, and info only when it's included">report:
          <a id="repHtml" target="_blank" rel="noopener">page</a> ·
          <a id="repMd">md</a> · <a id="repCsv">csv</a> · <a id="repJson">json</a></span>
      </div>
      <div class="filters">
        <label><input type="checkbox" id="fInfo"> include info (no known exploit)</label>
        <label><input type="checkbox" id="fKeyword"> include keyword-only matches</label>
        <label id="ackFilter" hidden><input type="checkbox" id="fAcked"> show acknowledged <span id="ackCount"></span></label>
        <span class="muted" id="filterNote"></span>
      </div>
      <div class="bulk" id="bulkBar" hidden>
        <label class="selall"><input type="checkbox" id="selAll"> <span id="selCount">select all shown</span></label>
        <span class="bulkacts" id="bulkActions" hidden>
          <input id="bulkNote" type="text" maxlength="500" placeholder="note for all of them, e.g. patched in the May window" autocomplete="off" aria-label="Note">
          <select id="bulkDays" aria-label="How long">
            <option value="">no end date</option><option value="7">for 7 days</option><option value="30">for 30 days</option>
            <option value="90">for 90 days</option><option value="365">for a year</option>
          </select>
          <button id="bulkAck" class="btn primary" type="button">Acknowledge</button>
          <button id="bulkUnack" class="btn" type="button">Remove acknowledgement</button>
          <button id="bulkClear" class="linkish" type="button">clear selection</button>
        </span>
        <span class="bulkmsg" id="bulkMsg" role="status"></span>
      </div>
      <div id="matchList" class="list"></div>
    </section>

    <section id="changes" class="pane">
      <div class="filters">
        <label>last <select id="days"><option>1</option><option selected>7</option><option>30</option><option>90</option></select> days</label>
        <label><input type="checkbox" id="fAllEvents"> include CVEs you don't run</label>
      </div>
      <div id="eventList" class="list"></div>
    </section>

    <section id="hot" class="pane"><div id="hotBody"></div></section>
    <section id="search" class="pane"><div id="searchList" class="list"></div></section>
  </main>

  <aside class="detail" id="detail" aria-live="polite" hidden>
    <button class="close" id="closeDetail" type="button" aria-label="Close">&times;</button>
    <div id="detailBody"></div>
  </aside>
</div>
<script src="/app.js"></script>
</body>
</html>
