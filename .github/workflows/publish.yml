name: publish

# Builds the package and uploads it to PyPI when a GitHub release is published.
#
# Uses PyPI Trusted Publishing, so no API token is stored anywhere. On pypi.org, under
# Account -> Publishing, add a publisher for the project "cvescope":
#   owner magikh0e, repository cvescope, workflow publish.yml, environment pypi
# Running this workflow by hand (Actions -> publish -> Run workflow) uploads to TestPyPI instead;
# register the same publisher on test.pypi.org with environment testpypi.
#
# PyPI never accepts the same version twice, even after a deletion, so the release tag has to
# match cvescope/__init__.py's __version__ or nothing is uploaded.
# Actions are pinned to commits; the comment names the release.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - name: Release tag matches __version__
        if: github.event_name == 'release'
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          v=$(python -c "import re, pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('cvescope/__init__.py').read_text()).group(1))")
          if [ "v$v" != "$TAG" ]; then
            echo "::error::release tag $TAG doesn't match __version__ $v"
            exit 1
          fi
      - name: Tests
        run: python -m unittest discover -s tests
      - name: Build and check
        run: |
          python -m pip install build==1.6.1 twine==7.0.0
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/cvescope/
    permissions:
      id-token: write  # Trusted Publishing; nothing else
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3

  testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/cvescope/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
