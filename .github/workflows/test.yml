name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Ruff
        run: |
          python -m pip install ruff==0.15.16
          ruff check .
      - name: Page script parses
        run: node --check cvescope/web/app.js

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Install and smoke test
        shell: bash
        run: |
          python -m pip install .
          cvescope --version
          cvescope init "$RUNNER_TEMP/cvescope.toml"
          grep -q "inventory" "$RUNNER_TEMP/cvescope.toml"
          cvescope --config "$RUNNER_TEMP/cvescope.toml" status
